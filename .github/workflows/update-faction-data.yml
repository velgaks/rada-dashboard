name: Update faction data

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: update-faction-data-${{ github.ref }}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test data builders
        run: python -m unittest discover -s tests -v

      - name: Open the restricted Rada source tunnel
        shell: bash
        env:
          RADA_RELAY_HOST: ${{ vars.RADA_RELAY_HOST }}
          RADA_RELAY_HOST_KEY: ${{ vars.RADA_RELAY_HOST_KEY }}
          RADA_RELAY_SSH_KEY: ${{ secrets.RADA_RELAY_SSH_KEY }}
        run: |
          : "${RADA_RELAY_HOST:?Set the RADA_RELAY_HOST repository variable}"
          : "${RADA_RELAY_HOST_KEY:?Set the RADA_RELAY_HOST_KEY repository variable}"
          : "${RADA_RELAY_SSH_KEY:?Set the RADA_RELAY_SSH_KEY repository secret}"
          if [[ ! "$RADA_RELAY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo "RADA_RELAY_HOST must be a DNS name or IPv4 address" >&2
            exit 1
          fi

          umask 077
          relay_dir=$(mktemp -d "$RUNNER_TEMP/rada-source.XXXXXX")
          trap 'rm -f "$relay_dir/key"' EXIT
          printf '%s\n' "$RADA_RELAY_SSH_KEY" | tr -d '\r' > "$relay_dir/key"
          printf '%s\n' "$RADA_RELAY_HOST_KEY" > "$relay_dir/known_hosts"

          ssh -F /dev/null -fNT \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o "UserKnownHostsFile=$relay_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$relay_dir/key" \
            -L 127.0.0.1:41843:data.rada.gov.ua:443 \
            "rada-relay@$RADA_RELAY_HOST"

          printf '%s\n' \
            'connect-to = "data.rada.gov.ua:443:127.0.0.1:41843"' \
            'noproxy = "data.rada.gov.ua"' > "$relay_dir/.curlrc"
          export CURL_HOME="$relay_dir"
          curl --head --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors \
            https://data.rada.gov.ua/ogd/zal/mps/mps-trans_fr.csv
          printf 'CURL_HOME=%s\n' "$relay_dir" >> "$GITHUB_ENV"

      - name: Update faction summary
        run: python build_faction_summary.py
        timeout-minutes: 15

      - name: Update vote event flags
        run: python build_vote_event_flags.py
        timeout-minutes: 10

      - name: Update faction diagnostics
        run: python build_faction_diagnostics.py
        timeout-minutes: 15

      - name: Validate generated diagnostics artifact
        run: python -m unittest discover -s tests -p 'test_faction_diagnostics_artifact.py' -v

      - name: Commit and push if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faction_summary.json faction_summary.meta.json vote_event_flags.json faction_diagnostics.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-update dashboard data $(date -u +%Y-%m-%d)"
          git push
