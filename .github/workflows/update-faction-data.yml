name: Update faction data

on:
  schedule:
    # Every day at 11:00 UTC (14:00 Kyiv time)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run incremental update
        run: python build_faction_summary.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faction_summary.json faction_summary.meta.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-update faction_summary.json $(date -u +%Y-%m-%d)"
          git push
