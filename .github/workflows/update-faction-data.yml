name: Update faction data

on:
  schedule:
    # Every day at 11:00 UTC (14:00 Kyiv time)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test data builders
        run: python -m unittest discover -s tests -v

      - name: Update faction summary
        run: python build_faction_summary.py
        timeout-minutes: 15

      - name: Update vote event flags
        run: python build_vote_event_flags.py
        timeout-minutes: 10

      - name: Update faction diagnostics
        run: python build_faction_diagnostics.py
        timeout-minutes: 15

      - name: Validate generated diagnostics artifact
        run: python -m unittest discover -s tests -p 'test_faction_diagnostics_artifact.py' -v

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faction_summary.json faction_summary.meta.json vote_event_flags.json faction_diagnostics.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-update dashboard data $(date -u +%Y-%m-%d)"
          git push
